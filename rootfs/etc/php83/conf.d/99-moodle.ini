; Moodle-tuned PHP settings (overrides defaults)
max_input_vars = 5000
memory_limit = 256M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 600

expose_php = Off
date.timezone = UTC

; Sessions: store under dataroot for better isolation
session.save_handler = files
session.save_path = "/tmp"
; Consider overriding to ${MOODLE_DATA_DIR}/tmp in production

; Opcache (Moodle benefits significantly — tuned for container workloads)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit_buffer_size = 64M

; Recommended by Moodle
realpath_cache_size = 4M
realpath_cache_ttl = 600
