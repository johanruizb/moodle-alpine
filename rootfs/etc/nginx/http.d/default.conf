server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/html;
    index index.php index.html;

    server_name _;
    client_max_body_size 256M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # HSTS is rendered into this snippet by 15-render-nginx.sh when MOODLE_SSLPROXY=yes
    include /etc/nginx/snippets/hsts.conf;
    # Remove server identity
    server_tokens off;

    # Moodle dataroot must never be web-accessible
    location /moodledata/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; }

    # --- Static assets with long cache (Moodle uses cache-busting hashes) ---
    location ~* ^/theme/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx replaces (not merges) parent add_header when any is set here,
        # so the full security set must be repeated.
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "SAMEORIGIN"       always;
        add_header X-XSS-Protection        "1; mode=block"    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ~* ^/lib/.*\.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "SAMEORIGIN"       always;
        add_header X-XSS-Protection        "1; mode=block"    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Pretty URLs for Moodle (slasharguments)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }

        fastcgi_pass   unix:/run/php/php-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        include        fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Proxy headers — pass real IP to PHP
        fastcgi_param  HTTP_X_FORWARDED_FOR    $http_x_forwarded_for;
        fastcgi_param  HTTP_X_FORWARDED_PROTO  $http_x_forwarded_proto;
        fastcgi_param  HTTP_X_FORWARDED_HOST   $http_x_forwarded_host;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
